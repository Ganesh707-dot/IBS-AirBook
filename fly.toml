# Fly.io — FREE all-in-one deploy (Angular UI + Java API on ONE URL)
# Live URL after deploy: https://airbook-enterprise.fly.dev
#
# Fastest path (no local tools): GitHub Actions
#   1. Create free account: https://fly.io/app/sign-up
#   2. fly auth login && fly tokens create deploy -x 999999h
#   3. GitHub repo → Settings → Secrets → FLY_API_TOKEN = paste token
#   4. Actions → "Deploy to Fly.io" → Run workflow
#
# Local CLI:
#   bash scripts/build-all.sh
#   fly deploy --dockerfile Dockerfile.prod

app = 'airbook-enterprise'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.prod'

[env]
  SPRING_PROFILES_ACTIVE = 'prod'
  PORT = '8080'
  JAVA_OPTS = '-XX:+UseContainerSupport -Xms128m -Xmx384m -Djava.security.egd=file:/dev/./urandom'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '120s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
