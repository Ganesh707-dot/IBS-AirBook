# Fly.io — recommended FREE deployment for IBS interview demo
# Docs: https://fly.io/docs/getting-started/
#
# One-time setup:
#   1. Install Fly CLI: https://fly.io/docs/hands-on/install-flyctl/
#   2. fly auth login
#   3. fly launch --no-deploy   (use existing fly.toml, say NO to Postgres)
#   4. fly secrets set JWT_SECRET="$(openssl rand -base64 32)"
#   5. fly deploy
#
# Your app URL: https://airbook-enterprise.fly.dev

app = 'airbook-enterprise'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  SPRING_PROFILES_ACTIVE = 'prod'
  PORT = '8080'
  JAVA_OPTS = '-XX:+UseContainerSupport -Xms128m -Xmx384m -Djava.security.egd=file:/dev/./urandom'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '120s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
