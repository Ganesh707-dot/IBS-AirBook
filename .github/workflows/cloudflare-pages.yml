name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/airbook-ui/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/airbook-ui/package-lock.json

      - name: Build Angular
        working-directory: frontend/airbook-ui
        run: npm ci && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/airbook-ui/browser --project-name=airbook-enterprise --commit-dirty=true
          workingDirectory: frontend/airbook-ui
